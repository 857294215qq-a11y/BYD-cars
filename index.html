<script>
(function(){
 try {
  var s = localStorage.getItem('byd-theme');
  var t = s || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.dataset.theme = t;
 } catch(e){}
})();
</script>
